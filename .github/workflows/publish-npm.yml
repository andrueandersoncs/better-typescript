name: Publish npm

on:
  release:
    types: [published]

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GOWORK: "off"
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          printf 'VERSION=%s\n' "${TAG#v}" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: false

      - name: Install Go
        run: mise install go@1.26

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - name: Use minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
          package-manager-cache: false

      - name: Check
        run: ./scripts/check.sh

      - name: Build packages
        run: |
          ./scripts/build-npm-packages.sh "$VERSION" dist/npm
          ./scripts/pack-npm-packages.sh dist/npm dist/npm/tarballs
          ./scripts/test-npm-packages.sh dist/npm/tarballs

      - name: Use release Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Test release Node.js
        run: ./scripts/test-npm-packages.sh dist/npm/tarballs

      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/publish-npm-package.sh dist/npm/tarballs/andrueandersoncs-better-typescript-darwin-amd64-*.tgz
          ./scripts/publish-npm-package.sh dist/npm/tarballs/andrueandersoncs-better-typescript-darwin-arm64-*.tgz
          ./scripts/publish-npm-package.sh dist/npm/tarballs/andrueandersoncs-better-typescript-linux-amd64-*.tgz
          ./scripts/publish-npm-package.sh dist/npm/tarballs/andrueandersoncs-better-typescript-linux-arm64-*.tgz

      - name: Publish launcher
        run: ./scripts/publish-npm-package.sh dist/npm/tarballs/andrueandersoncs-better-typescript-[0-9]*.tgz
