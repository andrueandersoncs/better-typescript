<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow State Machine Simulation</title>
<style>
:root {
  --canvas: #101312; --grid: #1b211f; --node: #171c1a; --node-2: #1d2321;
  --line: #3b4541; --line-soft: #29312e; --text: #e9edea; --muted: #8f9b96;
  --active: #eee6a8; --active-ink: #151714; --enabled: #88c8b9;
  --blocked: #dc887d; --success: #92c990; --focus: #eeb96f;
}
* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--canvas); }
body { color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, select { font: inherit; }
button:focus-visible, select:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
#app { position: relative; }
#graph { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background-color: var(--canvas); background-image: radial-gradient(circle, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
#graph.dragging { cursor: grabbing; }
.edge-path { fill: none; stroke: var(--line-soft); stroke-width: 2; marker-end: url(#arrow); vector-effect: non-scaling-stroke; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 18; cursor: help; vector-effect: non-scaling-stroke; }
.edge-label-bg { fill: var(--canvas); stroke: var(--line-soft); stroke-width: 1; opacity: .92; }
.edge-label { fill: #68736f; font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .035em; text-anchor: middle; }
.edge.enabled .edge-path { stroke: var(--enabled); stroke-width: 3; stroke-dasharray: 8 6; }
.edge.enabled .edge-label { fill: var(--enabled); }
.edge.enabled .edge-label-bg { stroke: var(--enabled); }
.edge.traversed .edge-path { stroke: var(--active); stroke-width: 4; stroke-dasharray: none; }
.edge.traversed .edge-label { fill: var(--active); }
.edge.traversed .edge-label-bg { stroke: var(--active); }
.node { cursor: help; }
.node-body { fill: var(--node); stroke: var(--line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.node-kind { fill: var(--muted); font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .13em; text-anchor: middle; }
.node-label { fill: var(--text); font-size: 14px; font-weight: 680; text-anchor: middle; }
.node-context { fill: var(--active-ink); font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
.node[data-kind="decision"] .node-body { stroke: #b69b62; stroke-dasharray: 5 4; }
.node[data-kind="blocked"] .node-body { stroke: var(--blocked); stroke-width: 2.5; }
.node[data-kind="success"] .node-body { stroke: var(--success); stroke-width: 2.5; }
.node[data-kind="start"] .node-body { stroke: #9d91c4; }
.node.active .node-body { fill: var(--active); stroke: var(--active); stroke-width: 4; }
.node.active .node-label, .node.active .node-kind { fill: var(--active-ink); }
.node.active .node-kind { opacity: .72; }
.node.active { filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
.node.rejected .node-body { stroke: var(--blocked); stroke-width: 5; }
.graph-controls { position: fixed; z-index: 10; top: 16px; right: 16px; display: flex; gap: 6px; padding: 5px; background: rgba(19,23,22,.88); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(10px); }
.graph-control { width: 44px; height: 44px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; font-weight: 700; }
.graph-control:hover { color: var(--text); background: var(--node-2); }
.event-dock { position: fixed; z-index: 12; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100vw - 28px)); display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(19,23,22,.93); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,.35); backdrop-filter: blur(14px); }
.dock-state { min-width: 0; max-width: 170px; }
.dock-kicker { color: var(--muted); font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
.dock-name { margin-top: 3px; overflow: hidden; color: var(--text); font-size: 13px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
.event-list { min-width: 0; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: thin; padding: 2px; }
.event-control { display: flex; align-items: center; gap: 6px; }
.event-control select { min-height: 44px; max-width: 180px; padding: 6px; border: 1px solid var(--line); border-radius: 5px; color: var(--text); background: var(--node-2); }
.event-button, .reset-button { min-height: 44px; border: 1px solid var(--line); border-radius: 5px; background: var(--node-2); color: var(--text); cursor: pointer; white-space: nowrap; }
.event-button { padding: 7px 11px; display: grid; gap: 2px; text-align: left; }
.event-button:hover { border-color: var(--enabled); background: #222a27; }
.event-prefix { color: var(--muted); font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
.event-type { color: var(--enabled); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
.reset-button { padding: 0 13px; color: var(--muted); background: transparent; }
.reset-button:hover { color: var(--text); border-color: var(--text); }
.terminal-message { align-self: center; color: var(--muted); font: 650 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
.dock-status { grid-column: 1 / -1; min-height: 14px; margin-top: -7px; color: var(--muted); font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
.dock-status.accepted { color: var(--enabled); }
.dock-status.rejected { color: var(--blocked); }
.tooltip { position: fixed; z-index: 20; width: min(310px, calc(100vw - 24px)); pointer-events: none; padding: 10px 12px; color: var(--text); background: #202624; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; transform: translateY(4px); transition: opacity 100ms ease, transform 100ms ease; }
.tooltip.visible { opacity: 1; transform: translateY(0); }
.tooltip-type { color: var(--enabled); font: 650 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
.tooltip-title { margin-top: 4px; font-size: 13px; font-weight: 700; }
.tooltip-copy, .tooltip-source { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.tooltip-source { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (max-width: 620px) {
  .graph-controls { top: 10px; right: 10px; }
  .event-dock { bottom: 10px; width: calc(100vw - 20px); grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
  .dock-state { grid-column: 1 / -1; max-width: none; display: flex; align-items: baseline; gap: 8px; }
  .dock-name { margin-top: 0; }
  .event-list { grid-column: 1; }
  .reset-button { grid-column: 2; grid-row: 2; }
  .dock-status { grid-row: 3; }
}
@media (prefers-reduced-motion: reduce) { .tooltip { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <svg id="graph" aria-label="Interactive state machine graph" role="application"></svg>
  <nav class="graph-controls" aria-label="Graph controls">
    <button class="graph-control" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">−</button>
    <button class="graph-control" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    <button class="graph-control" id="fit" type="button" aria-label="Fit graph to view" title="Fit graph to view">⌗</button>
    <button class="graph-control" id="focusActive" type="button" aria-label="Focus active state" title="Focus active state">◎</button>
  </nav>
  <div class="event-dock" id="eventDock" tabindex="-1" aria-label="State machine event emitter">
    <div class="dock-state"><div class="dock-kicker">Active state</div><div class="dock-name" id="activeName"></div></div>
    <div class="event-list" id="eventList"></div>
    <button class="reset-button" id="reset" type="button">Reset</button>
    <div class="dock-status" id="dockStatus" aria-hidden="true"></div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</div>

      contextText.textContent = `${state.relevantContextKey}: ${value.length > 25 ? `${value.slice(0, 24)}…` : value}`;
    } else contextText.textContent = "";
  });
}
function renderEmitter() {
  const state = stateById.get(runtime.stateId); activeName.textContent = state.label; eventList.replaceChildren();
  const events = availableEvents();
  if (!events.length) eventList.append(htmlElement("div", "terminal-message", terminalKind(state.kind) ? `${state.kind.toUpperCase()} · no target events accepted` : "No event currently accepted"));
  for (const { event, choices } of events) {
    const control = htmlElement("div", "event-control");
    let payload = undefined;
    if (event.payload) {
      const select = htmlElement("select"); select.setAttribute("aria-label", `Choose ${event.payload.label} for ${event.type}`);
      choices.forEach((choice, index) => {
        const option = htmlElement("option"); option.value = String(index); option.textContent = choice.label; select.append(option);
      });
      payload = () => payloadForChoice(event, choices[Number(select.value)]);
      control.append(select);
    }
    const button = htmlElement("button", "event-button"); button.type = "button";
    button.setAttribute("aria-label", `Emit ${event.type}: ${event.label}`); button.title = event.description;
    button.append(htmlElement("span", "event-prefix", "EMIT"), htmlElement("span", "event-type", event.type));
    button.addEventListener("click", () => emit(event.type, typeof payload === "function" ? payload() : undefined, true));
    control.append(button); eventList.append(control);
  }
}
function render() { updateGraphState(); renderEmitter(); }
function rejectEvent(type, reason) {
  const activeNode = graph.querySelector(`.node[data-id="${runtime.stateId}"]`); activeNode.classList.add("rejected");
  setTimeout(() => activeNode.classList.remove("rejected"), 550);
  const message = reason === "ambiguous" ? `${type} is ambiguous in ${stateById.get(runtime.stateId).label}` : `${type} rejected by ${stateById.get(runtime.stateId).label}`;
  showStatus(message, "rejected"); announce(`Event ${type} ${reason}. State unchanged.`); return false;
}
function emit(type, payload, fromControl = false) {
  const transitions = matchingTransitions(type, payload);
  if (transitions.length !== 1) return rejectEvent(type, transitions.length ? "ambiguous" : "rejected");
  const transition = transitions[0];
  transition.updates.forEach(applyUpdate); runtime.lastTransitionId = transition.id; runtime.stateId = transition.to;
  const destination = stateById.get(runtime.stateId); render(); showStatus(`${type} → ${destination.label}`, "accepted"); announce(`Event ${type} accepted. Active state: ${destination.label}.`);
  focusState(destination, false); if (fromControl) eventDock.focus({ preventScroll: true }); return true;
}
function reset() {
  runtime = { stateId: machine.initialStateId, context: clone(machine.initialContext), lastTransitionId: null };
  render(); showStatus("Machine reset", "accepted"); announce(`Machine reset. Active state: ${stateById.get(runtime.stateId).label}.`); focusState(stateById.get(runtime.stateId), false);
}
window.stateMachine = Object.freeze({ emit: (type, payload) => emit(String(type), payload, false), reset, getSnapshot: () => clone(runtime) });
resetButton.addEventListener("click", reset);

let view = { x: 0, y: 200, w: 1250, h: 700 };
function viewportAspect() { return Math.max(.4, graph.clientWidth / Math.max(1, graph.clientHeight)); }
function applyView() { graph.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function focusState(state, preserveScale = true) {
  const aspect = viewportAspect(); const width = preserveScale ? view.w : Math.min(1320, Math.max(760, window.innerWidth * 1.05)); const height = width / aspect;
  view = { x: state.x - width / 2, y: state.y - height / 2, w: width, h: height }; applyView();
}
function fitGraph() {
  const aspect = viewportAspect(), paddedW = BOUNDS.w + 180, paddedH = BOUNDS.h + 180;
  let width = paddedW, height = width / aspect;
  if (height < paddedH) { height = paddedH; width = height * aspect; }
  view = { x: BOUNDS.x + BOUNDS.w / 2 - width / 2, y: BOUNDS.y + BOUNDS.h / 2 - height / 2, w: width, h: height }; applyView();
}
function zoom(factor) { const cx = view.x + view.w / 2, cy = view.y + view.h / 2; view.w *= factor; view.h *= factor; view.x = cx - view.w / 2; view.y = cy - view.h / 2; applyView(); }
document.getElementById("zoomIn").addEventListener("click", () => zoom(.82));
document.getElementById("zoomOut").addEventListener("click", () => zoom(1.22));
document.getElementById("fit").addEventListener("click", fitGraph);
document.getElementById("focusActive").addEventListener("click", () => focusState(stateById.get(runtime.stateId), false));
graph.addEventListener("wheel", event => { event.preventDefault(); zoom(event.deltaY > 0 ? 1.1 : .9); }, { passive: false });
let drag = null;
graph.addEventListener("pointerdown", event => {
  if (event.target.closest(".node") || event.target.closest(".edge-hit")) return;
  drag = { x: event.clientX, y: event.clientY, view: { ...view } }; graph.setPointerCapture(event.pointerId); graph.classList.add("dragging"); hideTooltip();
});
graph.addEventListener("pointermove", event => {
  if (!drag) return; const rect = graph.getBoundingClientRect();
  view.x = drag.view.x - (event.clientX - drag.x) * drag.view.w / rect.width; view.y = drag.view.y - (event.clientY - drag.y) * drag.view.h / rect.height; applyView();
});
function endDrag(event) { drag = null; graph.classList.remove("dragging"); if (event && graph.hasPointerCapture(event.pointerId)) graph.releasePointerCapture(event.pointerId); }
graph.addEventListener("pointerup", endDrag); graph.addEventListener("pointercancel", endDrag);
window.addEventListener("resize", () => focusState(stateById.get(runtime.stateId), false));

renderGraph(); render(); requestAnimationFrame(() => focusState(stateById.get(runtime.stateId), false));
</script>
</body>
